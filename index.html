<!DOCTYPE html>
<html>
<head>
    <title>Water Business Tool</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {margin:0; padding:0; box-sizing:border-box;}
        body {font-family:Arial,sans-serif; height:100vh; overflow:hidden;}
        
        #loginScreen {
            display:flex; align-items:center; justify-content:center;
            height:100vh; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
        }
        .login-box {
            background:white; padding:40px; border-radius:16px;
            box-shadow:0 20px 60px rgba(0,0,0,0.3); width:400px;
        }
        .login-box h1 {font-size:24px; margin-bottom:20px; text-align:center;}
        .login-box input {
            width:100%; padding:12px; margin-bottom:15px;
            border:2px solid #ddd; border-radius:8px; font-size:14px;
        }
        .login-box button {
            width:100%; padding:12px; background:#667eea; color:white;
            border:none; border-radius:8px; cursor:pointer; font-weight:bold; font-size:14px;
        }
        .login-box button:hover {background:#5568d3;}
        
        #app {display:none; height:100vh; flex-direction:column;}
        
        .header {
            background:#667eea; color:white; padding:15px 20px;
            display:flex; justify-content:space-between; align-items:center;
        }
        .header h1 {font-size:20px;}
        .header button {
            background:rgba(255,255,255,0.2); color:white; border:none;
            padding:8px 16px; border-radius:6px; cursor:pointer;
        }
        
        .container {display:flex; height:calc(100vh - 70px);}
        
        .sidebar {
            width:300px; background:#f5f7fa; border-right:1px solid #ddd;
            overflow-y:auto; padding:20px;
        }
        
        .tabs {display:flex; flex-direction:column; gap:8px; margin-bottom:20px;}
        .tab {
            padding:12px; background:white; border:none; border-radius:8px;
            cursor:pointer; text-align:left; font-size:14px; font-weight:600;
        }
        .tab.active {background:#667eea; color:white;}
        
        .tab-content {display:none;}
        .tab-content.active {display:block;}
        
        .section {background:white; padding:15px; border-radius:8px; margin-bottom:15px;}
        .section h3 {font-size:14px; margin-bottom:10px; color:#333;}
        
        label {display:flex; align-items:center; margin-bottom:8px; cursor:pointer; font-size:13px;}
        label input[type="checkbox"] {margin-right:8px;}
        
        button.action-btn {
            width:100%; padding:10px; background:#667eea; color:white;
            border:none; border-radius:6px; cursor:pointer; font-size:13px; margin-top:10px;
        }
        button.action-btn:hover {background:#5568d3;}
        
        #map {flex:1; height:100%;}
        
        .stat {text-align:center; padding:15px; background:white; border-radius:8px; margin-bottom:10px;}
        .stat-value {font-size:32px; font-weight:bold; color:#667eea;}
        .stat-label {font-size:12px; color:#666; margin-top:5px;}
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <h1>🚰 Water Business Tool</h1>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="doLogin()">Login</button>
        <p style="text-align:center; margin-top:15px; font-size:12px; color:#666;">
            Use: admin / admin2024!
        </p>
    </div>
</div>

<div id="app">
    <div class="header">
        <div>
            <h1>🚰 Water Business Expansion Tool</h1>
            <p style="font-size:12px; margin-top:5px;"><span id="totalPOIs">0</span> POIs • 24 Distributors</p>
        </div>
        <button onclick="logout()">Logout</button>
    </div>
    
    <div class="container">
        <div class="sidebar">
            <div class="tabs">
                <button class="tab active" data-tab="overview">📊 Overview</button>
                <button class="tab" data-tab="distributors">📦 Distributors</button>
                <button class="tab" data-tab="expansion">🎯 Expansion</button>
            </div>
            
            <div id="overview-tab" class="tab-content active">
                <div class="section">
                    <h3>Map Layers</h3>
                    <label><input type="checkbox" id="showPlants" checked onchange="togglePlants()"> 🏭 Plants</label>
                    <label><input type="checkbox" id="showDist" checked onchange="toggleDist()"> 📦 Distributors</label>
                    <label><input type="checkbox" id="showPOIs" checked onchange="togglePOIs()"> 📍 POIs</label>
                </div>
                
                <div class="stat">
                    <div class="stat-value" id="totalPOIs2">27,800</div>
                    <div class="stat-label">Total POIs</div>
                </div>
                
                <div class="stat">
                    <div class="stat-value">24</div>
                    <div class="stat-label">Active Distributors</div>
                </div>
            </div>
            
            <div id="distributors-tab" class="tab-content">
                <div class="section">
                    <h3>Distributor Network</h3>
                    <p style="font-size:13px; color:#666;">24 active distributors serving Karnataka region</p>
                    <button class="action-btn" onclick="alert('Feature coming soon!')">View Performance</button>
                </div>
            </div>
            
            <div id="expansion-tab" class="tab-content">
                <div class="section">
                    <h3>Export Data</h3>
                    <button class="action-btn" onclick="exportPOIs()">📥 Export POIs</button>
                </div>
            </div>
        </div>
        
        <div id="map"></div>
    </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
